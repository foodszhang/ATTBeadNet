# Multisize K-class bead detection training config

global_seed: 42

data:
  train_root: "datasets/processed/20260511_tiles_64"
  test_root: ""
  num_classes: 2
  class_names: ["1.0", "2.8"]
  input_channels: 1
  tile_size: 64
  stride: 32
  batch_size: 32
  num_workers: 4

model:
  name: "Unet3"
  encoder: "default"
  skip_ch: 64
  aux_losses: 0
  use_cgm: false
  dropout: 0.3
  pretrained: false

train:
  seed: 42
  epochs: 50
  lr: 0.001
  optimizer: "adamw"
  weight_decay: 0.0001
  val_interval: 1
  device: "cuda"
  loss_type: "focal_dice"
  class_weights: null
  focal_gamma: 2.0
  dice_weight: 1.0
  focal_weight: 1.0
  count_loss_weight: 0.0
  save_name: "multisize_kclass"
  log_dir: "./runs/multisize"

postprocess:
  thresholds: [0.5, 0.5]
  min_distances: [3, 5]
  match_radius: 3